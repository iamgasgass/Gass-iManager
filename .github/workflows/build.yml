name: Build GassiManager IPA

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gassimanager-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      SCHEME: GassiManager
      CONFIGURATION: Release
      BUILD_DIR: ${{ github.workspace }}/build
      IPA: ${{ github.workspace }}/GassiManager-Unsigned.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$DEVELOPER_DIR" ]; then
            LATEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
            echo "Pinned Xcode not found, falling back to $LATEST"
            echo "DEVELOPER_DIR=$LATEST/Contents/Developer" >> "$GITHUB_ENV"
            export DEVELOPER_DIR="$LATEST/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project from project.yml
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          xcodebuild -project GassiManager.xcodeproj -list

      - name: Build GassiManager
        shell: bash
        run: |
          set -uo pipefail
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR/logs"
          LOG="$BUILD_DIR/logs/xcodebuild.log"

          xcodebuild \
            clean build \
            -project GassiManager.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee "$LOG"

          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "========== BUILD ERRORS =========="
            grep -nEi 'error:|fatal error:|BUILD FAILED' "$LOG" | head -n 200 || true
            echo ""
            tail -n 150 "$LOG" || true
            exit "$STATUS"
          fi

      - name: Verify GassiManager bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="$BUILD_DIR/Build/Products/${CONFIGURATION}-iphoneos/GassiManager.app"
          INFO="$APP/Info.plist"

          test -d "$APP" || { echo "::error::GassiManager.app not found"; exit 1; }
          test -f "$INFO" || { echo "::error::Info.plist missing"; exit 1; }

          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")"
          BINARY="$APP/$EXECUTABLE"
          test -f "$BINARY" || { echo "::error::GassiManager executable missing"; find "$APP" -maxdepth 2 -print; exit 1; }

          for KEY in CFBundleDisplayName CFBundleExecutable CFBundleIdentifier CFBundleShortVersionString; do
            printf '%s: ' "$KEY"
            /usr/libexec/PlistBuddy -c "Print :$KEY" "$INFO"
          done

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")"
          if [ "$BUNDLE_ID" != "app.gassilab.GassiManager" ]; then
            echo "::error::Unexpected bundle identifier: $BUNDLE_ID"
            exit 1
          fi

          file "$BINARY"
          lipo -info "$BINARY"

          ICON_METADATA="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' "$INFO" 2>/dev/null || true)"
          if [ -n "$ICON_METADATA" ]; then
            printf '%s\n' "$ICON_METADATA"
          else
            echo "::warning::CFBundleIcons is not present. The current GassiManager project has no AppIcon asset catalog configured; continuing without making this a build failure."
          fi

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$BUILD_DIR/Build/Products/${CONFIGURATION}-iphoneos/GassiManager.app"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          PAYLOAD="$GITHUB_WORKSPACE/Payload"
          rm -rf "$PAYLOAD" "$IPA"
          mkdir -p "$PAYLOAD"
          cp -R "$APP" "$PAYLOAD/GassiManager.app"
          cd "$GITHUB_WORKSPACE"
          ditto -c -k --sequesterRsrc --keepParent "$PAYLOAD" "$IPA"
          ls -lh "$IPA"
          unzip -l "$IPA" | grep -F "Payload/GassiManager.app/$EXECUTABLE" >/dev/null
          unzip -l "$IPA" | grep -F "Payload/GassiManager.app/Info.plist" >/dev/null
          echo "Unsigned IPA structure OK."

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GassiManager-Unsigned-IPA
          path: ${{ env.IPA }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GassiManager-Build-Log
          path: ${{ env.BUILD_DIR }}/logs/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7

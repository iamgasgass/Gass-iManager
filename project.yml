name: Gass iManager
options:
  bundleIdPrefix: com.iamgasgass
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  AppEntitlements:
    url: https://github.com/wiedem/app-entitlements.git
    from: 2.0.0

targets:
  "Gass iManager":
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GassiManager
    dependencies:
      - package: AppEntitlements
        product: AppEntitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamgasgass.gassimanager
        PRODUCT_NAME: "Gass iManager"
        PRODUCT_MODULE_NAME: GassiManager
        INFOPLIST_KEY_CFBundleDisplayName: "Gass iManager"
        INFOPLIST_KEY_CFBundleName: "Gass iManager"
        INFOPLIST_KEY_CFBundleShortVersionString: "1.0.0"
        INFOPLIST_KEY_CFBundleVersion: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: GassiManager/GassiManager.entitlements
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
    scheme:
      testTargets:
        - "Gass iManagerTests"
      gatherCoverageData: true

  "Gass iManagerTests":
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GassiManagerTests
    dependencies:
      - target: "Gass iManager"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamgasgass.gassimanager.tests
        PRODUCT_MODULE_NAME: GassiManagerTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
